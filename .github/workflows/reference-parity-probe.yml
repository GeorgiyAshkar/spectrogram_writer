name: Reference parity DOM probe
# probe-version: instrument-v2

on:
  workflow_dispatch:
  push:
    branches:
      - playmusictheory
    paths:
      - scripts/reference-dom-probe.mjs
      - scripts/reference-interaction-probe.cjs
      - scripts/reference-instrument-probe.cjs
      - .github/workflows/reference-parity-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe public reference DOM
        run: node scripts/reference-dom-probe.mjs
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          test -n "$CHROME"
      - name: Dump rendered reference DOM
        shell: bash
        run: |
          "${{ steps.chrome.outputs.path }}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=4000 \
            --dump-dom \
            https://playmusictheory.net/play > /tmp/playmusictheory-rendered.html
      - name: Probe rendered reference DOM
        run: node scripts/reference-dom-probe.mjs /tmp/playmusictheory-rendered.html
      - name: Install interaction probe dependency
        run: npm install --prefix /tmp/parity-probe --no-save puppeteer-core@24
      - name: Probe public interactions
        run: node scripts/reference-interaction-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Pixel mode geometry
        run: node scripts/reference-pixel-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Freehand Y frequency curve
        run: node scripts/reference-freehand-curve-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe public exports
        run: node scripts/reference-export-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe reference instrument spectra
        run: node scripts/reference-instrument-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Render reference DOM in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=5000 --dump-dom https://playmusictheory.net/play > /tmp/play-rendered.html
          node scripts/reference-dom-probe.mjs /tmp/play-rendered.html

name: Reference focused parity probes

on:
  workflow_dispatch:
  push:
    branches:
      - playmusictheory
    paths:
      - scripts/reference-pixel-probe.cjs
      - scripts/reference-pixel-rows-probe.cjs
      - scripts/reference-freehand-curve-probe.cjs
      - scripts/reference-freestyle-timing-probe.cjs
      - scripts/reference-freestyle-pitch-probe.cjs
      - scripts/reference-accompaniment-probe.cjs
      - scripts/reference-arpeggio-scale-probe.cjs
      - scripts/reference-arpeggio-flux-probe.cjs
      - scripts/reference-drums-transient-probe.cjs
      - scripts/reference-export-probe.cjs
      - scripts/reference-take-probe.cjs
      - scripts/reference-instrument-envelope-probe.cjs
      - scripts/reference-freestyle-handler-probe.cjs
      - .github/workflows/reference-focused-probes.yml

jobs:
  pixel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          test -n "$CHROME"
      - name: Install probe dependency
        run: npm install --prefix /tmp/parity-probe --no-save puppeteer-core@24
      - name: Probe Pixel mode geometry
        run: node scripts/reference-pixel-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Pixel vertical rows
        run: node scripts/reference-pixel-rows-probe.cjs "${{ steps.chrome.outputs.path }}"

  pitch-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          test -n "$CHROME"
      - name: Install probe dependency
        run: npm install --prefix /tmp/parity-probe --no-save puppeteer-core@24
      - name: Probe pitch curves
        run: node scripts/reference-freehand-curve-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Freestyle onset timing
        run: node scripts/reference-freestyle-timing-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Freestyle runtime state
        run: node scripts/reference-freestyle-handler-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Freestyle vertical pitch
        run: node scripts/reference-freestyle-pitch-probe.cjs "${{ steps.chrome.outputs.path }}"

  accompaniment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          test -n "$CHROME"
      - name: Install probe dependency
        run: npm install --prefix /tmp/parity-probe --no-save puppeteer-core@24
      - name: Probe accompaniment patterns
        run: node scripts/reference-accompaniment-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Arpeggio scale mapping
        run: node scripts/reference-arpeggio-scale-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Arpeggio spectral flux
        run: node scripts/reference-arpeggio-flux-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe Drums transients
        run: node scripts/reference-drums-transient-probe.cjs "${{ steps.chrome.outputs.path }}"

  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          test -n "$CHROME"
      - name: Install probe dependency
        run: npm install --prefix /tmp/parity-probe --no-save puppeteer-core@24
      - name: Probe public exports
        run: node scripts/reference-export-probe.cjs "${{ steps.chrome.outputs.path }}"
      - name: Probe take recorder policy
        run: node scripts/reference-take-probe.cjs "${{ steps.chrome.outputs.path }}"


  envelopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          test -n "$CHROME"
      - name: Install probe dependency
        run: npm install --prefix /tmp/parity-probe --no-save puppeteer-core@24
      - name: Probe instrument envelopes
        run: node scripts/reference-instrument-envelope-probe.cjs "${{ steps.chrome.outputs.path }}"
